<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHAMED MOSTAFA ASHOOR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header-top">محمد عاشور</div>
<div class="container">
            <div class="card-main">
            <h1>Mohamed Mostafa Ashoor</h1>
            <p>مشروع: محمد مصطفى عاشور</p>
            <p>سجل المصروفات والواردات</p>
            </div>
  <div class="card-form">
    <div class="title">المصروفات</div>
    <div class="sub">اكتب التاريخ كنص، واحفظ نسخة احتياطية</div>
    <div class="grid">
      <div><label>التاريخ:</label><input type="text" id="date" placeholder="مثلا: يوم الجمعة 22-9"></div>
      <div><label>المبلغ (جنيه):</label><input type="number" id="amount" placeholder="اكتب المبلغ"></div>
      <div><label>النوع:</label><select id="type"><option value="دخل">دخل (إضافة)</option><option value="صرف">صرف (خصم)</option></select></div>
      <div><label>الملاحظات:</label><input type="text" id="note" placeholder="اكتب ملاحظة: كهرباء، مياه..."></div>
    </div>
    <div class="btns">
      <button class="btn-save" onclick="saveData()">حفظ</button>
      <button class="btn-show" onclick="toggleTable()">عرض السجل</button>
      <button class="btn-exp" onclick="exportData()">حفظ نسخة احتياطية</button>
      <button class="btn-qr" onclick="makeQR()">مشاركة للموبايل</button>
      <button class="btn-qr" onclick="clearQR()" style="background:#7f8c8d">إخفاء المشاركة</button>
    </div>
    <input type="file" id="fileInput" hidden accept=".json" onchange="importData(event)">
    <button onclick="document.getElementById('fileInput').click()" style="background:#8e44ad; color:white; margin-top:10px; padding:8px 15px; border:none; border-radius:8px; cursor:pointer;">استرجاع نسخة احتياطية</button>
    <div class="total-box">إجمالي الرصيد الحالي: <span id="total">0</span> جنيه</div>
    <div id="qrcode"></div>
    <table id="table"><thead><tr><th>التاريخ</th><th>المبلغ</th><th>النوع</th><th>الملاحظة</th><th>حذف</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
